[defaults]
# Roles directory relative to the project root.
# Without this, ansible-playbook run from playbooks/ would not find roles/.
roles_path = roles

# Inventory default -- operators may also specify -i explicitly.
# inventory = inventory/example-homelab

# Human-readable diff on changed tasks.
diff_always = false

# Do not create .retry files on failure (avoids repo clutter).
retry_files_enabled = false
