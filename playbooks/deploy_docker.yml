---
# Telemetron -- M1 deploy orchestrator (Docker target)
#
# Brings up the Telemetron observability plane on a single Docker host.
# Orchestrates 12 deployed roles plus `nfsd` as a 13th opt-in slot
# (default-off via `enable_nfsd: false`). The `telemetron` Docker bridge
# network is created in pre_tasks below.
#
# Per-role targeted re-runs use --tags <role>:
#   ansible-playbook -i inventory/example-homelab playbooks/deploy_docker.yml --tags minio
#
# Usage:
#   ansible-playbook -i inventory/example-homelab \
#                    playbooks/deploy_docker.yml \
#                    --ask-vault-pass

- name: Telemetron -- deploy to Docker host
  hosts: telemetron
  gather_facts: true
  become: false

  collections:
    - community.docker

  pre_tasks:
    - name: Ensure the telemetron Docker bridge network exists
      community.docker.docker_network:
        name: "{{ telemetron_network }}"
        driver: bridge
        state: present
      tags:
        - always
        - network

  roles:
    - role: minio
      tags:
        - minio
    - role: loki
      tags:
        - loki
    - role: tempo
      tags:
        - tempo
    - role: mimir
      tags:
        - mimir
    - role: node_exporter
      tags:
        - node_exporter
    - role: opentelemetry
      tags:
        - opentelemetry
    - role: prometheus
      tags:
        - prometheus
    - role: fluentbit
      tags:
        - fluentbit
    - role: alertmanager
      tags:
        - alertmanager
    - role: grafana
      tags:
        - grafana
    - role: karma
      tags:
        - karma
    - role: nfsd
      tags:
        - nfsd
      when: enable_nfsd | default(false) | bool
  # M1 deploy order (v1.0.1 -- PromLens removed):
  # minio -> loki -> tempo -> mimir -> node_exporter -> opentelemetry
  # -> prometheus -> fluentbit -> alertmanager -> grafana -> karma
  # -> nfsd (opt-in via enable_nfsd).
