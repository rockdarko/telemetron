---
# roles/fluentbit/tasks/purge.yml
# Phase 11 per-role irreversible purge surface (PURGE-01 + PURGE-02).
#
# Invoked by playbooks/undeploy_docker.yml (Plan 11-04) via
# `include_role: { name: fluentbit, tasks_from: purge }` AFTER the same
# role's `tasks_from: uninstall` (D-152). The orchestrator gates the
# include on `telemetron_purge_data=true OR telemetron_purge_images=true`;
# every task below additionally belt-and-suspenders the same `when:` clause
# (D-153) so this file is safe to include unconditionally.
#
# IRREVERSIBLE -- once tasks here execute the named volume and/or pinned
# Docker image are gone. The pre-action `debug` WARN tasks (D-145 + D-157
# + D-159) ensure the operator sees the event in PLAY OUTPUT.
#
# Tag-scoped composition (D-151): every task carries ONLY the `fluentbit`
# tag (D-133 -- no `fluentbit-purge`, no `fluentbit-data`, no
# `fluentbit-image`, no `fluentbit-buffer` sub-tags). `--tags fluentbit` +
# the purge flags scopes the purge to ONLY this role's artifacts.
#
# ---- Buffer / data variable-name asymmetry (intentional gap) ----
# The operator-facing flag is `telemetron_purge_data` (uniform across all
# 5 standard roles), but the role-internal volume variable is
# `fluentbit_buffer_volume`. There is NO equivalent fluentbit data-named
# variable -- the role only defines the buffer volume (see
# roles/fluentbit/defaults/main.yml line 31). This is the D-50 crash-safe
# filesystem buffer. The flag name is the operator UX surface; the
# variable name preserves D-50's original semantic (buffer != data).
# This file references {{ fluentbit_buffer_volume }} verbatim and the
# WARN message uses the buffer-volume token so the audit log is
# unambiguous.
#
# Trust contract:
#   - docker_volume state=absent has NO failed_when guard -- a failure here
#     means a container is still attached, which means the uninstall.yml
#     ordering is broken; surface loudly (D-141 trust state=absent).
#   - docker_image state=absent uses failed_when:false (D-154 -- NOT the
#     broader error-suppression toggle) so docker-daemon-unreachable
#     errors still surface; only the image-in-use-by-non-Telemetron-
#     container error gets swallowed and followed by a post-skip WARN.
#   - No handler-notify clauses (D-142).
#   - No host-dirs section -- parent /opt/telemetron/ rmdir lives in
#     undeploy_docker.yml post_tasks (D-155), NOT per-role.

# ------------------ telemetron_purge_data section ------------------

- name: WARN -- fluentbit purge_data is about to remove named volume (buffer)
  ansible.builtin.debug:
    msg: "WARNING: irreversible -- fluentbit purge_data: {{ fluentbit_buffer_volume }}"
  when: telemetron_purge_data | default(false) | bool
  tags:
    - fluentbit

- name: Remove fluentbit named Docker volume (D-50 crash-safe buffer)
  community.docker.docker_volume:
    name: "{{ fluentbit_buffer_volume }}"
    state: absent
  when: telemetron_purge_data | default(false) | bool
  tags:
    - fluentbit

# ------------------ telemetron_purge_images section ------------------

- name: WARN -- fluentbit purge_images is about to remove pinned image
  ansible.builtin.debug:
    msg: "WARNING: irreversible -- fluentbit purge_images: {{ fluentbit_image }}:{{ fluentbit_image_tag }}"
  when: telemetron_purge_images | default(false) | bool
  tags:
    - fluentbit

# D-154: failed_when:false catches "image in use by non-Telemetron container"
# without swallowing real errors (e.g., docker daemon unreachable).
- name: Remove fluentbit pinned Docker image
  community.docker.docker_image:
    name: "{{ fluentbit_image }}:{{ fluentbit_image_tag }}"
    state: absent
  failed_when: false
  register: fluentbit_purge_image_result
  when: telemetron_purge_images | default(false) | bool
  tags:
    - fluentbit

- name: WARN -- fluentbit image removal skipped (in use)
  ansible.builtin.debug:
    msg: "WARNING: fluentbit image {{ fluentbit_image }}:{{ fluentbit_image_tag }} could not be removed (likely in use by a non-Telemetron container)"
  when:
    - telemetron_purge_images | default(false) | bool
    - fluentbit_purge_image_result.failed | default(false)
  tags:
    - fluentbit
