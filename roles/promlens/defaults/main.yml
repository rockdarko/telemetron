---
# roles/promlens/defaults/main.yml
# PromLens v0.3.0 role tunables. Override per-environment in
# inventory/<env>/group_vars/all/promlens.yml.
#
# UI plane role -- D-82 exempts from telemetron_publish_default:false.
# Stateless: no volume, no rendered config file (PromLens is pure-CLI).
# DEPRECATION CANDIDATE -- see roles/promlens/README.md banner.
# Prometheus 3.x's built-in UI absorbs PromLens's tree-view feature.

# --- Image pin (OPS-01; UI-06) ---
# PromLens v0.3.0 -- last tagged 2022-12-05. RESEARCH §2.3 notes the image
# is still pullable as of 2026-05 but may be archived in a future
# milestone. README documents the SHA-pin air-gap recommendation.
promlens_image: prom/promlens
promlens_image_tag: "v0.3.0"

# --- Container identity ---
promlens_container_name: telemetron-promlens

# --- Host port publishing (D-82 inverts D-30 for UI plane) ---
promlens_publish_host: true
promlens_bind_address: "0.0.0.0"   # D-83

# --- Port matrix (D-84) ---
# PromLens internal listen port is 8080 (Dockerfile EXPOSE 8080 -- RESEARCH §2.3).
# Host-publish at 8081.
promlens_http_port: 8081          # host-side
promlens_container_port: 8080     # container-side; matches --web.listen-address default

# --- Prometheus connection (RESEARCH §2.3 -- CLI flag, NOT env var) ---
# CRITICAL: PromLens v0.3.0 uses CLI flags only (kingpin). There is NO
# env-var equivalent for setting the default Prometheus URL. The correct
# flag is --web.default-prometheus-url=<url>. CONTEXT.md line 152
# (Claude's Discretion) suggested env-var configuration -- RESEARCH
# §2.3 corrected this. We use CLI flag exclusively.
promlens_prometheus_url: "http://prometheus:9090"

# --- Healthcheck (RESEARCH §2.3 -- image has NO built-in HEALTHCHECK; explicit required) ---
# RESEARCH §2.3: PromLens 0.3.0 has NO dedicated /health endpoint.
# Use root path `/` as the readiness signal (returns HTTP 200 + PromLens UI HTML).
promlens_healthcheck_enabled: true
promlens_healthcheck_test: ["CMD-SHELL", "wget --spider -q http://localhost:{{ promlens_container_port }} || exit 1"]
promlens_healthcheck_interval: 30s
promlens_healthcheck_timeout: 5s
promlens_healthcheck_retries: 3
promlens_healthcheck_start_period: 15s

# --- Verify pre-poll (D-10a) ---
promlens_health_retries: 20
promlens_health_delay: 2

# --- Restart policy (OPS-06) ---
promlens_restart_policy: unless-stopped

# --- Resource limits ---
promlens_memory_limit: 128m

# --- Network ---
promlens_network: "{{ telemetron_network | default('telemetron') }}"

# --- Timezone (OPS-06) ---
promlens_tz: "{{ telemetron_tz | default('Etc/UTC') }}"

# --- Curl image pin for verify (OPS-01) ---
promlens_curl_image: curlimages/curl
promlens_curl_image_tag: "8.10.1"
