---
# roles/minio/tasks/main.yml
# MinIO server deploy + bucket bootstrap.
# Per D-08: bootstrap is the LAST task in this role; downstream backends
# depend on serial role ordering in playbooks/deploy_docker.yml.

- name: Ensure MinIO config directory exists on host
  ansible.builtin.file:
    path: "{{ minio_config_dir }}"
    state: directory
    mode: "0755"
  tags:
    - minio
    - minio-config

- name: Render MinIO env file
  ansible.builtin.template:
    src: minio.env.j2
    dest: "{{ minio_config_dir }}/minio.env"
    mode: "0600"
  notify: restart minio
  tags:
    - minio
    - minio-config

- name: Ensure MinIO data volume exists
  community.docker.docker_volume:
    name: "{{ minio_data_volume }}"
    state: present
  tags:
    - minio

- name: Pull MinIO server image
  community.docker.docker_image:
    name: "{{ minio_image }}:{{ minio_image_tag }}"
    source: pull
    force_source: false
  tags:
    - minio

- name: Run MinIO server container
  community.docker.docker_container:
    name: "{{ minio_container_name }}"
    image: "{{ minio_image }}:{{ minio_image_tag }}"
    state: started
    recreate: false
    restart_policy: "{{ minio_restart_policy }}"
    memory: "{{ minio_memory_limit }}"
    env_file: "{{ minio_config_dir }}/minio.env"
    command:
      - server
      - "{{ minio_data_path }}"
      - --console-address
      - ":{{ minio_console_port }}"
    networks:
      - name: "{{ minio_network }}"
        aliases:
          # Container name is `telemetron_<role>` (visible in `docker ps`).
          # Short alias preserves backward-compat for cross-role config refs
          # like `http://minio:9000` in loki/tempo/mimir templates.
          - "{{ minio_container_name }}"
          - minio
    labels:
      org.telemetron.service: telemetron
      org.telemetron.job: minio
    # Per D-12, D-13: zero host publish by default. Only publish if
    # the operator explicitly sets minio_publish_host to true or 127.0.0.1.
    published_ports: >-
      {{
        (
          [ minio_api_port | string + ':' + minio_api_port | string,
            minio_console_port | string + ':' + minio_console_port | string ]
          if minio_publish_host is sameas true else
          [ '127.0.0.1:' + minio_api_port | string + ':' + minio_api_port | string,
            '127.0.0.1:' + minio_console_port | string + ':' + minio_console_port | string ]
          if minio_publish_host == '127.0.0.1' else
          []
        )
      }}
    mounts:
      - source: "{{ minio_data_volume }}"
        target: "{{ minio_data_path }}"
        type: volume
    healthcheck:
      test: "{{ minio_healthcheck_test }}"
      interval: "{{ minio_healthcheck_interval }}"
      timeout: "{{ minio_healthcheck_timeout }}"
      retries: "{{ minio_healthcheck_retries }}"
      start_period: "{{ minio_healthcheck_start_period }}"
  tags:
    - minio
    - minio-container

# Bootstrap MUST be the final task -- D-08. Downstream Phase 2 backends
# (loki, tempo, mimir) depend on serial role ordering in deploy_docker.yml
# so they don't start until this include returns.
- name: Bootstrap MinIO buckets (blocking)
  ansible.builtin.include_tasks: bootstrap.yml
  tags:
    - minio
    - minio-bootstrap
