---
# roles/minio/handlers/main.yml
# Per D-19 / Pitfall 8: container restarts on config change use
# `docker restart <name>` (preserves container state). The module-level
# `state` parameter is intentionally not used for restarts -- force-recreate
# is non-idempotent.
#
# MinIO env-var changes require a container restart (no SIGHUP reload
# path), so the env-file template notifies this handler.

- name: Docker restart minio
  ansible.builtin.command:
    cmd: "docker restart {{ minio_container_name }}"
  changed_when: true
  listen: restart minio
