---
# roles/alertmanager/tasks/restore.yml
# Confirm-gated restore for Alertmanager silences + nflog state (RESTORE-V13-04).
#
# Symmetric inverse of tasks/backup.yml. Refuses to run without
# `backup_restore_confirm=true` (role-level safety gate -- mirrors v1.2.0
# D-159 `telemetron_purge_data=true` contract). Defaults to the
# latest-discovery via `find ... | sort -r | head -1` lexicographic-on-
# ISO-8601-basic-UTC discovery (D-179). Operators can pin a specific
# tarball via --extra-vars backup_restore_from=20260603T143012Z.
#
# Sequence: confirm-gate -> latest-discovery (if backup_restore_from empty)
# -> resolve backup_src_path -> WARN -> integrity-check (tar tf) ->
# docker stop -> wait stopped -> wipe _data/ -> untar -> always-restart
# (AN-2) -> include verify.yml (D-178 -- 202-line file asserts /-/ready,
# /-/healthy, /api/v2/* + Prom->AM round-trip + amtool synthetics).
#
# AP-1 empty-data restore symmetry: A backup taken on a fresh deploy may
# carry no `data/` subdir inside the tarball. Untar of such a tarball
# leaves an empty _data/ directory; on first state-write (silence add /
# notification dedup), Alertmanager creates `data/` and the protobuf
# files automatically. NO post-untar "ensure data/ subdir exists" task
# is needed. `tar --zstd -tf` on an empty tarball returns rc=0 with an
# empty listing -- the integrity check is robust to both empty and
# populated tarballs.
#
# AP-2 (stale nflog re-fire -- docs only): Restoring nflog may re-enable
# old dedup memory; operators wired to REAL receivers (Slack/email/etc.)
# may see re-notification for ongoing alerts. Telemetron's default
# config uses the `null` receiver so there is no re-notification surface.
# Operator education for real-receiver setups lives in the Phase 15
# per-role README + quickstart.md doc cascade. Selective state-restore
# is an explicit v1.3.0 anti-feature (FEATURES.md).
#
# AP-3 (no cluster state): Single-instance --cluster.listen-address=""
# means no gossip-peer-merge pitfalls on container restart.
#
# AN-2 always-restart: the always: clause runs docker start + verify
# even if untar failed. This is non-negotiable -- a half-restored volume
# with the container down is the worst possible state.
#
# Unlike Prometheus restore, NO post-untar cleanup task is needed:
# Alertmanager has no analog to Prometheus's /prometheus/lock file
# (no PID-based lock; no WAL; no sidecar files; protobuf files are
# read+rewritten in place).
#
# WR-01 (operator-interrupt window -- documented corner case):
# If the operator sends SIGINT (Ctrl-C) or ansible-playbook is killed
# between the wipe step (find -mindepth 1 -delete on the data volume)
# and the untar step, the always: clause STILL fires -- the Alertmanager
# container restarts against an empty data volume. AP-1 covers this case:
# Alertmanager creates a fresh `data/` subdir on first state-write, so
# the container will START cleanly but with no prior silences or nflog
# dedup memory (all historical silences lost). The AN-2 always-restart
# guarantee becomes a footgun for THIS specific failure mode. Recovery:
# re-run the restore play (it is idempotent at the file level -- the
# wipe is a no-op on an already-empty volume and the untar reconstitutes
# state). The integrity check (tar --zstd -tf) above guards against a
# corrupt tarball but cannot guard against a mid-destructive-sequence
# interrupt. Phase 15 surfaces this in the per-role README operator
# guidance.
#
# Tags: [alertmanager, restore] on block: parent (D-133 + ARCHITECTURE
# sec.5).

# Confirm gate -- fires BEFORE any destructive step (and before tarball
# discovery, so a misconfigured run fails fast without touching disk).
# Mirrors v1.2.0 D-159 telemetron_purge_data gate idiom.
#
# WR-02: this gate runs FIRST -- BEFORE the zstd package install -- so a
# no-confirm invocation fails fast WITHOUT mutating system state on the
# target host. Previously the zstd install ran first, contradicting the
# spirit of the safety contract documented in the header above.
- name: Fail unless backup_restore_confirm is set
  ansible.builtin.fail:
    msg: "Restore is destructive. Set --extra-vars backup_restore_confirm=true to confirm."
  when: not (backup_restore_confirm | default(false) | bool)
  tags:
    - alertmanager
    - restore

# WR-03: validate operator-supplied backup_restore_from BEFORE it is
# interpolated into a tar path. The regex pins the format to ISO 8601
# basic UTC (YYYYMMDDTHHMMSSZ) -- the same format backup.yml emits
# (D-179). An empty value is allowed (latest-discovery path). This
# prevents path-traversal payloads like "../../../etc/passwd" from
# being interpolated into ansible.builtin.command cmd: scalars.
- name: Validate backup_restore_from matches ISO 8601 basic UTC format
  ansible.builtin.assert:
    that:
      - >-
        backup_restore_from | default('') == ''
        or backup_restore_from | default('') | regex_search('^[0-9]{8}T[0-9]{6}Z$') is not none
    fail_msg: >-
      backup_restore_from must be an ISO 8601 basic UTC timestamp
      (YYYYMMDDTHHMMSSZ), got: {{ backup_restore_from | default('') }}
  tags:
    - alertmanager
    - restore

# OPS-V13-04: zstd ensure-present (idempotent; no-op once installed).
- name: Ensure zstd is installed for tar --zstd decompression
  ansible.builtin.package:
    name: zstd
    state: present
  become: true
  tags:
    - alertmanager
    - restore

# Latest-tarball discovery (D-179): lexicographic sort is chronological
# because filenames are ISO 8601 basic UTC (YYYYMMDDTHHMMSSZ -- a
# monotonic format). Skipped when operator pins backup_restore_from.
# WR-04: set -o pipefail makes the pipeline exit non-zero when find fails
# (e.g. backup directory does not exist on a fresh host that never ran
# backup). Without pipefail, head's exit 0 masks find's failure and the
# task fails with the misleading "stdout was empty" rather than the
# actual root cause from find's stderr. executable: /bin/bash is required
# because pipefail is a bash-ism not in POSIX sh.
# WR-06: become: true is required because backup_dest_root/<role>/ was
# created at mode 0700 + owner root by backup.yml (XP-4). A non-root
# ansible user (the common case for SSH-keyed homelab inventories) cannot
# chdir into the 0700-root-owned directory; find would fail with permission
# denied stderr and an empty stdout pipeline. Matches the grafana and
# prometheus latest-discovery pattern.
- name: Discover latest Alertmanager backup tarball (when backup_restore_from empty)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      find {{ backup_dest_root }}/alertmanager/ -name 'alertmanager-*.tar.zst' -type f -printf '%f\n'
      | sort -r | head -1
  args:
    executable: /bin/bash
  register: alertmanager_latest_tarball
  changed_when: false
  failed_when: alertmanager_latest_tarball.rc != 0 or alertmanager_latest_tarball.stdout == ""
  when: backup_restore_from | default("") == ""
  become: true
  tags:
    - alertmanager
    - restore

# Resolve backup_src_path: pinned timestamp wins; otherwise use the
# discovered latest filename. Both branches produce an absolute path
# under backup_dest_root/alertmanager/.
- name: Resolve Alertmanager backup source path
  ansible.builtin.set_fact:
    backup_src_path: >-
      {{
        (backup_dest_root + '/alertmanager/alertmanager-' + backup_restore_from + '.tar.zst')
        if (backup_restore_from | default('') != '')
        else (backup_dest_root + '/alertmanager/' + alertmanager_latest_tarball.stdout)
      }}
  tags:
    - alertmanager
    - restore

# CR-02: resolve host-side mountpoint via docker_volume_info instead of
# hardcoding /var/lib/docker/volumes/<vol>/_data -- daemon-data-root-agnostic.
- name: Resolve Alertmanager data volume mountpoint (CR-02 data-root-agnostic)
  community.docker.docker_volume_info:
    name: "{{ alertmanager_data_volume }}"
  register: alertmanager_data_volume_info
  tags:
    - alertmanager
    - restore

# D-159 WARN: identifiers only -- volume name + tarball path. No
# `tar tf` content listing (information-disclosure mitigation per
# threat model T-13-05-04).
- name: WARN -- alertmanager restore will overwrite existing volume contents
  ansible.builtin.debug:
    msg: "WARNING: irreversible -- alertmanager restore: {{ alertmanager_data_volume }} from {{ backup_src_path }}"
  tags:
    - alertmanager
    - restore

# Integrity check BEFORE wipe -- a corrupted tarball must not destroy
# existing on-disk state. `tar --zstd -tf` returns rc=0 on a valid
# tarball regardless of whether the content listing is empty (AP-1
# fresh-deploy edge case) or fully populated.
- name: Integrity-check Alertmanager backup tarball before wipe
  ansible.builtin.command:
    cmd: "tar --zstd -tf {{ backup_src_path }}"
  changed_when: false
  become: true
  tags:
    - alertmanager
    - restore

# Cold-quiesce + wipe + untar block. always: clause restarts + verifies
# whether or not the destructive sequence succeeded (AN-2 + D-178).
- name: Cold-quiesce Alertmanager restore -- block (AN-2)
  block:
    - name: Stop Alertmanager container for restore (XP-1)
      ansible.builtin.command: "docker stop -t {{ alertmanager_backup_stop_timeout }} {{ alertmanager_container_name }}"
      changed_when: true
      become: true

    - name: Wait for Alertmanager container to reach stopped state
      community.docker.docker_container_info:
        name: "{{ alertmanager_container_name }}"
      register: alertmanager_stopped_check
      until: >-
        alertmanager_stopped_check.container is defined
        and alertmanager_stopped_check.container.State is defined
        and alertmanager_stopped_check.container.State.Running == false
      retries: 30
      delay: 2
      changed_when: false

    # Wipe in-place via `find -mindepth 1 -delete` (STACK.md sec.3 --
    # `docker_volume state: absent` is the wrong tool; it changes the
    # volume ID and may break Docker's mount table). The -mindepth 1
    # preserves _data/ itself (the volume mount-point) while clearing
    # all children.
    - name: Wipe existing Alertmanager volume contents
      ansible.builtin.command:
        cmd: "find {{ alertmanager_data_volume_info.volume.Mountpoint }} -mindepth 1 -delete"
      become: true
      changed_when: true

    # Untar into the wiped volume. Empty-state tarballs untar to an
    # empty _data/ (AP-1: AM creates `data/` and the protobuf files on
    # first state-write -- no post-untar ensure-subdir task is needed).
    - name: Untar Alertmanager backup into volume
      ansible.builtin.command:
        cmd: >-
          tar --zstd -xpf {{ backup_src_path }}
          -C {{ alertmanager_data_volume_info.volume.Mountpoint }}
      become: true
      changed_when: true

    # NO PP-1-style lock-file deletion here -- Alertmanager has no
    # analog to Prometheus's /prometheus/lock (no PID-based lock; no
    # WAL; no sidecar files per AP-1). Intentional asymmetry with the
    # Prometheus restore.

  always:
    # AN-2: container ALWAYS restarts even if wipe/untar failed.
    - name: Restart Alertmanager container after restore (AN-2)
      ansible.builtin.command: "docker start {{ alertmanager_container_name }}"
      changed_when: true
      become: true

    # D-178: verify.yml re-used as-is. RESTORE-V13-04 success criterion 3
    # is the /api/v2/status check, which verify.yml asserts as part of
    # the 9-step verification suite (config + /api/v2/* probes).
    - name: Verify Alertmanager post-restore
      ansible.builtin.include_tasks: verify.yml
  tags:
    - alertmanager
    - restore
