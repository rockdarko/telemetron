---
galaxy_info:
  role_name: loki
  author: Rock Martel-Langlois
  description: >
    Deploys Grafana Loki 3.7.2 in monolithic mode against MinIO S3
    (loki-chunks bucket). Log backend for Telemetron's observability
    plane; consumed by Grafana (Phase 5) and Fluent Bit / OTel (Phase 3).
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: Debian
      versions: [bookworm]
  galaxy_tags:
    - logs
    - loki
    - grafana
    - observability
    - telemetron

dependencies: []

collections:
  - community.docker
  - ansible.builtin
