---
# roles/garage/tasks/bootstrap.yml
# Multi-step bootstrap for Garage: HEALTHCHECK poll, layout assign/apply,
# S3 key create-and-persist (D-112), bucket create, bucket allow, verify.
#
# All bootstrap exec tasks use changed_when: false except layout assign/apply
# (which are gated with `when:`) and key create (changed_when: true, first-run only).
#
# Idempotency gates:
# - Layout assign/apply: defensive dual-check (rc != 0 OR 'NO ROLE ASSIGNED' in stdout)
# - Key create: D-112 host file check (stat -> slurp if exists, key create if absent)
# - Bucket create: failed_when accepts both rc=0 and 'already exists' in stderr
#
# Direct mitigation for RESEARCH Pitfall 1 (layout apply re-run) and
# Pitfall 3 (key create secret shown once).

# Step 1: poll the container's Docker HEALTHCHECK status until it
# reports `healthy`. Per D-10a: we read the status via docker_container_info
# rather than firing uri against :3900, because the no-host-publish model
# means the control host cannot reach the Garage API directly.
- name: Wait for Garage container HEALTHCHECK to report healthy
  community.docker.docker_container_info:
    name: "{{ garage_container_name }}"
  register: garage_health_check
  until: >-
    garage_health_check.container is defined
    and garage_health_check.container.State is defined
    and garage_health_check.container.State.Health is defined
    and garage_health_check.container.State.Health.Status == 'healthy'
  retries: "{{ garage_health_retries }}"
  delay: "{{ garage_health_delay }}"
  changed_when: false
  tags:
    - garage
    - garage-bootstrap

# Step 2: get the Garage node ID (hex@ip:port format).
# We need only the hex prefix for layout assign (Pitfall 6).
- name: Get Garage node ID
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: /garage node id --quiet
  register: garage_node_id_raw
  changed_when: false
  tags:
    - garage
    - garage-bootstrap

# Step 3: extract just the hex node ID by stripping the @ip:port suffix.
# Example: "abcdef1234567890@192.168.1.100:3901" -> "abcdef1234567890"
- name: Set garage_node_id fact
  ansible.builtin.set_fact:
    garage_node_id: "{{ garage_node_id_raw.stdout.split('@')[0] }}"
  tags:
    - garage
    - garage-bootstrap

# Step 4: check current layout status.
# Used as the gate for steps 5 and 6 (layout assign/apply).
# Defensive dual-check: rc != 0 is the primary gate (handles unexpected
# output format); 'NO ROLE ASSIGNED' in stdout is secondary confirmation.
# 'garage status' is the correct command -- the 'NO ROLE ASSIGNED' string
# appears in the per-node status column, not in 'garage layout show' output.
- name: Check Garage layout status
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: /garage status
  register: garage_layout_show
  changed_when: false
  tags:
    - garage
    - garage-bootstrap

# Step 5: assign layout zone and capacity (only if not yet assigned).
# The defensive dual-check gates this task so re-runs skip it when the
# layout is already in place (avoids version mismatch errors -- Pitfall 1).
- name: Assign Garage layout
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: >-
      /garage layout assign
      -z {{ garage_layout_zone }}
      -c {{ garage_layout_capacity }}
      {{ garage_node_id }}
  changed_when: true
  when: garage_layout_show.rc != 0 or 'NO ROLE ASSIGNED' in garage_layout_show.stdout
  tags:
    - garage
    - garage-bootstrap

# Step 6: apply the layout (commits the assignment).
# Gated with the same defensive dual-check as Step 5.
# --version 1 is correct for first-run; re-runs are skipped by the when: guard.
- name: Apply Garage layout
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: /garage layout apply --version 1
  changed_when: true
  when: garage_layout_show.rc != 0 or 'NO ROLE ASSIGNED' in garage_layout_show.stdout
  tags:
    - garage
    - garage-bootstrap

# ---------- D-112: S3 key create with host-file persistence ----------
# The Garage S3 key is auto-generated on first run and persisted to a
# host-side file (garage_s3_credentials_file, mode 0600). Re-runs load
# credentials from the file, skipping key creation entirely.
#
# S3 credentials are NOT in secrets.yml -- they are ephemeral from Garage's
# perspective (only shown at creation time via `key create`) and must be
# persisted by the bootstrap.

# Step 7a: check if credentials are already persisted on the host.
# Default path: {{ garage_config_dir }}/s3-credentials (mode 0600, T-08-02).
- name: Check if Garage S3 credentials exist on host
  ansible.builtin.stat:
    path: "{{ garage_s3_credentials_file }}"
  register: garage_creds_file
  changed_when: false
  tags:
    - garage
    - garage-bootstrap

# Step 7b: load existing credentials from the host file (re-run path).
# File format: two lines -- line 1: key_id=<value>, line 2: secret=<value>
- name: Load existing Garage S3 credentials from host file
  ansible.builtin.slurp:
    src: "{{ garage_s3_credentials_file }}"
  register: garage_creds_raw
  when: garage_creds_file.stat.exists
  changed_when: false
  tags:
    - garage
    - garage-bootstrap

# Step 7c: set credential facts from the host file (re-run path).
# File format: two lines -- line 1: key_id=<value>, line 2: secret=<value>.
# regex_search with multiline (?m) is robust to trailing newline + matches
# regardless of YAML-vs-Jinja newline-literal interpretation.
- name: Set Garage S3 credential facts from host file
  ansible.builtin.set_fact:
    garage_s3_access_key_id: "{{ (garage_creds_raw.content | b64decode) | regex_search('(?m)^key_id=(.+)$', '\\1') | first }}"
    garage_s3_secret_key: "{{ (garage_creds_raw.content | b64decode) | regex_search('(?m)^secret=(.+)$', '\\1') | first }}"
  when: garage_creds_file.stat.exists
  tags:
    - garage
    - garage-bootstrap

# ---------- D-112 amendment (Phase 11 G-01 closure): orphan key discovery ----------
# Before the first-run create branch fires, query Garage's preserved
# metadata for keys named `{{ garage_s3_key_name }}` so we can:
#   - take the create branch only when zero exist (true first run),
#   - take the recovery branch when exactly one exists (orphan from a
#     conservative undeploy that wiped the host credentials file but
#     preserved the telemetron_garage_meta volume per D-141),
#   - fail loudly when two or more exist (operator-introduced duplicate
#     that we will not silently reuse).
# Closes 11-VERIFICATION.md G-01 + transitively unblocks 11-HUMAN-UAT.md
# scenario 4b (G-02). See 11-06-PLAN.md for context.

- name: List existing Garage S3 keys (G-01: detect orphan from preserved metadata)
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: /garage key list
  register: garage_key_list_raw
  changed_when: false
  tags:
    - garage
    - garage-bootstrap

- name: Set garage_existing_telemetron_keys fact from key list output
  ansible.builtin.set_fact:
    garage_existing_telemetron_keys: "{{ garage_key_list_raw.stdout | regex_findall('(?m)^([0-9a-fA-F]+)\\s+' ~ garage_s3_key_name ~ '(?:\\s|$)') }}"
  tags:
    - garage
    - garage-bootstrap

# Step 7d: create a new Garage S3 key (first-run path, no host file).
# The key secret is only shown at creation time (Pitfall 3).
# Output is human-readable text with "Key ID:" and "Secret key:" lines.
- name: Create Garage S3 key
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: /garage key create {{ garage_s3_key_name }}
  register: garage_key_create_result
  changed_when: true
  when: not garage_creds_file.stat.exists and garage_existing_telemetron_keys | length == 0
  tags:
    - garage
    - garage-bootstrap

# Step 7e: set credential facts from key create output (first-run path).
# CR-01 fix: parse human-readable output via regex, not from_json.
- name: Set Garage S3 credential facts from key create output
  ansible.builtin.set_fact:
    garage_s3_access_key_id: "{{ garage_key_create_result.stdout | regex_search('Key ID:\\s*(\\S+)', '\\1') | first }}"
    garage_s3_secret_key: "{{ garage_key_create_result.stdout | regex_search('Secret key:\\s*(\\S+)', '\\1') | first }}"
  when: not garage_creds_file.stat.exists and garage_existing_telemetron_keys | length == 0
  tags:
    - garage
    - garage-bootstrap

# Step 7f: persist the credentials to the host file (first-run path).
# mode 0600: only readable by root/ansible user (T-08-02 mitigation).
- name: Persist Garage S3 credentials to host file
  ansible.builtin.copy:
    content: |
      key_id={{ garage_s3_access_key_id }}
      secret={{ garage_s3_secret_key }}
    dest: "{{ garage_s3_credentials_file }}"
    mode: "0600"
  when: not garage_creds_file.stat.exists and garage_existing_telemetron_keys | length == 0
  tags:
    - garage
    - garage-bootstrap

# ---------- D-112 amendment (Phase 11 G-01 closure): recovery branch ----------
# Reached when:
#   - the host credentials file is gone (caller: garage uninstall.yml
#     removed it as designed per D-145), AND
#   - exactly one telemetron key already exists in the preserved
#     metadata volume (orphan from the prior deploy whose secret we
#     never read out because uninstall removed the host file).
# Recovery path: extract the EXISTING key's secret via
# `/garage key info --show-secret <KEY_ID>`, populate the same fact
# pair the first-run branch sets, and re-persist to the host file so
# the NEXT run's step 7a fast-path hits.
# This is the D-146 recovery story (roles/garage/tasks/uninstall.yml
# header) made executable: the OLD key + secret are reused, so
# `bucket allow --key telemetron` (step 9) sees exactly ONE key
# named `telemetron` and the existing per-bucket ACLs remain intact.
# Net effect: Grafana shows OLD pre-undeploy data on redeploy.

- name: Read existing telemetron key info (recovery branch)
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: /garage key info --show-secret {{ garage_existing_telemetron_keys | first }}
  register: garage_key_info_result
  changed_when: false
  when: not garage_creds_file.stat.exists and garage_existing_telemetron_keys | length == 1
  tags:
    - garage
    - garage-bootstrap

- name: Set Garage S3 credential facts from existing key info (recovery branch)
  ansible.builtin.set_fact:
    garage_s3_access_key_id: "{{ garage_key_info_result.stdout | regex_search('Key ID:\\s*(\\S+)', '\\1') | first }}"
    garage_s3_secret_key: "{{ garage_key_info_result.stdout | regex_search('Secret key:\\s*(\\S+)', '\\1') | first }}"
  when: not garage_creds_file.stat.exists and garage_existing_telemetron_keys | length == 1
  tags:
    - garage
    - garage-bootstrap

- name: Persist recovered Garage S3 credentials to host file
  ansible.builtin.copy:
    content: |
      key_id={{ garage_s3_access_key_id }}
      secret={{ garage_s3_secret_key }}
    dest: "{{ garage_s3_credentials_file }}"
    mode: "0600"
  when: not garage_creds_file.stat.exists and garage_existing_telemetron_keys | length == 1
  tags:
    - garage
    - garage-bootstrap

# ---------- Bucket create, allow, verify ----------

# Step 8: create the required buckets.
# Defensive failed_when accepts BOTH rc=0 (clean create) AND rc != 0 when
# 'already exists' appears in stderr -- handles both idempotent exit codes
# (Open Question Q2 from RESEARCH resolved with defensive guard).
- name: Create Garage buckets
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: /garage bucket create {{ item }}
  loop: "{{ garage_buckets }}"
  register: garage_bucket_create
  changed_when: false
  failed_when: >-
    garage_bucket_create.rc is defined
    and garage_bucket_create.rc != 0
    and 'already exists' not in (garage_bucket_create.stderr | default(''))
  tags:
    - garage
    - garage-bootstrap

# Step 9: grant the S3 key read/write/owner permissions on each bucket.
# The `allow` command is idempotent (re-granting existing permissions is a no-op).
- name: Allow S3 key on Garage buckets
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: >-
      /garage bucket allow
      --read --write --owner
      {{ item }}
      --key {{ garage_s3_key_name }}
  loop: "{{ garage_buckets }}"
  changed_when: false
  tags:
    - garage
    - garage-bootstrap

# Step 10: verify all required buckets exist.
# /garage bucket info <bucket> exits non-zero if the bucket does not exist.
# failed_when: rc != 0 ensures missing buckets abort the playbook.
- name: Verify Garage buckets exist
  community.docker.docker_container_exec:
    container: "{{ garage_container_name }}"
    command: /garage bucket info {{ item }}
  loop: "{{ garage_buckets }}"
  register: garage_bucket_verify
  changed_when: false
  failed_when: >-
    garage_bucket_verify.rc is defined
    and garage_bucket_verify.rc != 0
  tags:
    - garage
    - garage-bootstrap
