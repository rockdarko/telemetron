---
# roles/garage/tasks/uninstall.yml
#
# Default-conservative undeploy for the Garage role (D-145).
#
# Removes ONLY the running container and ephemeral host-side config + S3
# credentials file. The named Docker volumes `telemetron_garage_meta` and
# `telemetron_garage_data` (defined in defaults/main.yml as
# {{ garage_meta_volume }} / {{ garage_data_volume }}) are deliberately
# preserved -- they hold the operator's metrics (Mimir), logs (Loki), and
# traces (Tempo) S3 objects. Destroying them is a separate operator
# decision and is NOT in scope for the default undeploy path.
#
# ---------------- D-146: Recovery story after re-deploy ----------------
#
# The S3 access key/secret are auto-generated by bootstrap.yml on the very
# first run and persisted to `{{ garage_s3_credentials_file }}` on the host
# (see roles/garage/defaults/main.yml). When this uninstall removes that
# credentials file, the NEXT `playbooks/deploy_docker.yml` run will:
#
#   1. See no credentials file -> hit the "first-run" branch in
#      tasks/bootstrap.yml (Step 7d) and run `/garage key create` again,
#      producing a NEW key_id + secret pair.
#   2. Persist the new pair back to `{{ garage_s3_credentials_file }}`
#      (Step 7f).
#   3. Re-create buckets if missing and grant the NEW key on every bucket
#      via `/garage bucket allow --read --write --owner <bucket>
#      --key {{ garage_s3_key_name }}` (tasks/bootstrap.yml lines 188-223
#      cover Steps 8 + 9 -- bucket create and bucket allow loops). The
#      `allow` command is idempotent: re-granting on an existing bucket
#      is a no-op for that bucket, and granting the NEW key on an
#      EXISTING bucket adds the new key to the bucket's ACL.
#
# Net effect: Loki, Tempo, and Mimir come back up against the SAME
# preserved volumes (`telemetron_garage_meta` + `telemetron_garage_data`),
# their config gets the new S3 key from bootstrap, and they regain
# read/write access to all their old data. No data loss.
#
# ---------------- D-147: Orphan key non-cleanup ----------------
#
# The OLD S3 key that this uninstall is "abandoning" remains in Garage's
# key registry as an orphan entry. We do NOT run `/garage key delete` for
# it here -- that would require the container to still be up at the time
# we read its key list (we don't have a snapshot), and a half-completed
# delete on a stopped Garage is worse than a clean orphan in a key list.
#
# Operators who care about hygiene can run `garage key list` and
# `garage key delete` manually after the next deploy. This is explicitly
# operator hygiene, not Phase 10 scope.
#
# -----------------------------------------------------------------------
# Strict D-145 task order below. Do NOT reorder; the WARN debug MUST
# precede the credentials-file removal so it appears in PLAY OUTPUT
# rather than being a silent side effect of the next `file:` task.
# -----------------------------------------------------------------------

# Task 1 (D-145): Stop and remove the Garage container, keeping its
# named Docker volumes intact. `keep_volumes: true` ensures
# telemetron_garage_meta and telemetron_garage_data survive the
# container removal.
- name: Stop and remove Garage container (preserve named volumes)
  community.docker.docker_container:
    name: "{{ garage_container_name }}"
    state: absent
    keep_volumes: true
  tags:
    - garage

# Task 2 (D-145): WARN the operator -- separately named so it appears as
# its own line in PLAY OUTPUT, not as a silent side effect of the
# credentials-file removal task that follows.
- name: WARN -- Garage S3 credentials are about to be removed
  ansible.builtin.debug:
    msg: "WARNING: removing Garage S3 credentials at {{ garage_s3_credentials_file }} -- next deploy will auto-generate a new S3 key"
  tags:
    - garage

# Task 3 (D-145): Remove the persisted S3 credentials file from the host.
# The next deploy will hit the first-run branch in bootstrap.yml and
# regenerate a new key + secret (see D-146 recovery story in header).
- name: Remove Garage S3 credentials file from host
  ansible.builtin.file:
    path: "{{ garage_s3_credentials_file }}"
    state: absent
  tags:
    - garage

# Task 4 (D-145): Remove the rendered Garage config directory from the
# host. The next deploy re-renders garage.toml and the parent-dir bind
# mount (Gate 8) into a fresh `{{ garage_config_dir }}`.
- name: Remove Garage config directory from host
  ansible.builtin.file:
    path: "{{ garage_config_dir }}"
    state: absent
  tags:
    - garage
