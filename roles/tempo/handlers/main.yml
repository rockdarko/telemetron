---
# roles/tempo/handlers/main.yml
# Per D-19 / Pitfall 8: container restarts on config change use
# `docker restart <name>`. The module-level state parameter is never
# used for restarts -- force-recreate is non-idempotent.
#
# Tempo config changes (storage, OTLP receivers, compactor knobs)
# require a container restart; the config-file template notifies this
# handler.

- name: Docker restart tempo
  ansible.builtin.command:
    cmd: "docker restart {{ tempo_container_name }}"
  changed_when: true
  listen: restart tempo
