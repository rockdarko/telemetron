---
# roles/tempo/tasks/uninstall.yml
# Per-role uninstall surface for Tempo (Phase 10 / UNDEPLOY-02).
# Named volume {{ tempo_data_volume }} (default: telemetron_tempo_data) is
# intentionally PRESERVED -- volume removal is Phase 11's concern (driven
# by telemetron_purge_data=true). Phase 11's playbooks/undeploy_docker.yml
# invokes this file via `include_role: { name: tempo, tasks_from: uninstall }`
# (D-132). Inverts the deploy sequence in tasks/main.yml minus volume +
# image removal; carries no notify: (D-142) and only the role tag (D-133).

- name: Remove tempo container
  community.docker.docker_container:
    name: "{{ tempo_container_name }}"
    state: absent
    keep_volumes: true
  tags:
    - tempo

- name: Remove tempo config directory
  ansible.builtin.file:
    path: "{{ tempo_config_dir }}"
    state: absent
  tags:
    - tempo
