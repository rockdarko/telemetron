---
# roles/mimir/tasks/uninstall.yml
# Per-role uninstall surface for Mimir (Phase 10 / UNDEPLOY-02).
# Named volume {{ mimir_data_volume }} (default: telemetron_mimir_data) is
# intentionally PRESERVED -- volume removal is Phase 11's concern (driven
# by telemetron_purge_data=true). Phase 11's playbooks/undeploy_docker.yml
# invokes this file via `include_role: { name: mimir, tasks_from: uninstall }`
# (D-132). Inverts the deploy sequence in tasks/main.yml minus volume +
# image removal; carries no notify: (D-142) and only the role tag (D-133).

- name: Remove mimir container
  community.docker.docker_container:
    name: "{{ mimir_container_name }}"
    state: absent
    keep_volumes: true
  tags:
    - mimir

- name: Remove mimir config directory
  ansible.builtin.file:
    path: "{{ mimir_config_dir }}"
    state: absent
  tags:
    - mimir
