---
galaxy_info:
  role_name: mimir
  author: Rock Martel-Langlois
  description: >
    Deploys Grafana Mimir 3.0.6 in monolithic mode against Garage S3
    with three distinct buckets (mimir-blocks / mimir-ruler /
    mimir-alerts). Long-term metrics backend for Telemetron's
    observability plane; receives Prometheus remote_write (Phase 3).
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: Debian
      versions: [bookworm]
  galaxy_tags:
    - metrics
    - mimir
    - grafana
    - observability
    - telemetron

dependencies: []

collections:
  - community.docker
  - ansible.builtin
