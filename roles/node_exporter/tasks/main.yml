---
# roles/node_exporter/tasks/main.yml
# node_exporter deploy + in-network verify.
# Mirrors the canonical roles/mimir/tasks/main.yml shape modulo node_exporter
# specifics: no rendered config (CLI-flag-driven), pid_mode host (required for
# some collectors), three RO bind-mounts to /host/{proc,sys,root}.
# Conditional healthcheck pattern matches mimir/tempo (RESEARCH Pitfall B):
# from-scratch image with no useful health flag, so default is the binary-alive
# proxy (node_exporter --version); operator can flip to Outcome C
# (node_exporter_healthcheck_enabled: false) without touching the role.

- name: Pull node_exporter image
  community.docker.docker_image:
    name: "{{ node_exporter_image }}:{{ node_exporter_image_tag }}"
    source: pull
    force_source: false
  tags:
    - node_exporter

- name: Run node_exporter container (with conditional healthcheck and hardening)
  community.docker.docker_container:
    name: "{{ node_exporter_container_name }}"
    image: "{{ node_exporter_image }}:{{ node_exporter_image_tag }}"
    state: started
    recreate: false
    restart_policy: "{{ node_exporter_restart_policy }}"
    memory: "{{ node_exporter_memory_limit }}"
    # pid_mode host is REQUIRED for some collectors (per RESEARCH Finding 6 +
    # upstream node_exporter README). The kernel-level access is read-only via
    # the /host/{proc,sys,root} bind-mounts below.
    pid_mode: host
    # Container hardening set (kept from upstream INSPQ, guarded by knob).
    # When the knob is false (e.g. RHEL SELinux interactions), all six fields
    # collapse to Ansible's `omit` magic value -- the docker_container module
    # then leaves Docker defaults in place.
    read_only: "{{ node_exporter_container_hardening_enabled | bool }}"
    cap_drop: "{{ ['ALL'] if (node_exporter_container_hardening_enabled | bool) else omit }}"
    capabilities: "{{ ['DAC_READ_SEARCH'] if (node_exporter_container_hardening_enabled | bool) else omit }}"
    security_opts: "{{ ['no-new-privileges:true'] if (node_exporter_container_hardening_enabled | bool) else omit }}"
    tmpfs: "{{ ['/tmp'] if (node_exporter_container_hardening_enabled | bool) else omit }}"
    pids_limit: "{{ 512 if (node_exporter_container_hardening_enabled | bool) else omit }}"
    networks:
      - name: "{{ node_exporter_network }}"
        aliases:
          - "{{ node_exporter_container_name }}"
    # Per D-30 / D-12: zero host publish by default. Operators reach
    # node_exporter from the workstation via SSH local-forward
    # (ssh -L 9100:localhost:9100 <host>); Phase 3 Prometheus scrape traffic
    # stays on the telemetron Docker bridge.
    published_ports: >-
      {{
        (
          [ node_exporter_port | string + ':' + node_exporter_port | string ]
          if node_exporter_publish_host is sameas true else
          [ '127.0.0.1:' + node_exporter_port | string + ':' + node_exporter_port | string ]
          if node_exporter_publish_host == '127.0.0.1' else
          []
        )
      }}
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
      - "--web.listen-address=0.0.0.0:{{ node_exporter_port }}"
    mounts:
      - source: /proc
        target: /host/proc
        type: bind
        read_only: true
      - source: /sys
        target: /host/sys
        type: bind
        read_only: true
      - source: /
        target: /host/root
        type: bind
        read_only: true
        propagation: rslave
    # From-scratch image; CMD form (not CMD-SHELL).
    # See RESEARCH.md Finding 6 + PITFALLS Pitfall B. The actual command form
    # is set in defaults/main.yml per image probe (Outcome B default for
    # node_exporter v1.11.1: --version as binary-alive proxy). When
    # node_exporter_healthcheck_enabled is false, the healthcheck key is
    # omitted entirely via Ansible's `omit` magic value -- OPS-06 compliance is
    # then satisfied by verify.yml's State.Running poll plus the in-network
    # /metrics curl probe.
    healthcheck: "{{ node_exporter_container_healthcheck if (node_exporter_healthcheck_enabled | bool) else omit }}"
    env:
      TZ: "{{ node_exporter_tz }}"
  vars:
    node_exporter_container_healthcheck:
      test: "{{ node_exporter_healthcheck_test }}"
      interval: "{{ node_exporter_healthcheck_interval }}"
      timeout: "{{ node_exporter_healthcheck_timeout }}"
      retries: "{{ node_exporter_healthcheck_retries }}"
      start_period: "{{ node_exporter_healthcheck_start_period }}"
  tags:
    - node_exporter
    - node_exporter-container

# Verify MUST be the final task (D-32). Mirrors roles/{loki,tempo,mimir}/tasks/main.yml
# pattern -- verify is included from main; not a separate playbook.
- name: Verify node_exporter end-to-end (readiness + /metrics assertion)
  ansible.builtin.include_tasks: verify.yml
  tags:
    - node_exporter
    - node_exporter-verify
