---
# roles/grafana/tasks/uninstall.yml
# Per-role uninstall surface for Grafana (Phase 10 / UNDEPLOY-02).
# Named volume {{ grafana_data_volume }} (default: telemetron_grafana_data)
# is intentionally PRESERVED -- volume removal is Phase 11's concern (driven
# by telemetron_purge_data=true). Phase 11's playbooks/undeploy_docker.yml
# invokes this file via `include_role: { name: grafana, tasks_from: uninstall }`
# (D-132). Inverts the deploy sequence in tasks/main.yml minus volume +
# image removal; the single `file: state=absent` on grafana_config_dir is
# recursive by Ansible default and handles the five nested provisioning
# subdirs (provisioning/datasources, provisioning/dashboards, ...). Carries
# no notify: (D-142) and only the role tag (D-133).

- name: Remove grafana container
  community.docker.docker_container:
    name: "{{ grafana_container_name }}"
    state: absent
    keep_volumes: true
  tags:
    - grafana

- name: Remove grafana config directory
  ansible.builtin.file:
    path: "{{ grafana_config_dir }}"
    state: absent
  tags:
    - grafana
