---
# Telemetron -- example-homelab inventory
# Single-host Docker target. Edit ansible_host / ansible_user / ansible_connection
# to point at your own Docker host. The defaults below run against the Ansible
# control host itself (ansible_connection: local).
#
# To target a remote host: set ansible_host to the remote IP/hostname,
# ansible_user to a sudo-capable account, remove `ansible_connection: local`,
# and ensure SSH key auth works.

all:
  children:
    telemetron:
      hosts:
        homelab:
          ansible_host: localhost
          ansible_user: "{{ lookup('env', 'USER') }}"
          ansible_connection: local
