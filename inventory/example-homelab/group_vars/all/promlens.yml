---
# inventory/example-homelab/group_vars/all/promlens.yml
# Operator-tunable knobs for roles/promlens (Phase 5; UI-06).
#
# DEPRECATION CANDIDATE: see roles/promlens/README.md.
# New deployments should consider --skip-tags promlens.

# --- Host publishing (D-82 inverts D-30 for UI plane) ---
promlens_publish_host: true
promlens_bind_address: "0.0.0.0"
promlens_http_port: 8081           # D-84 host-side
promlens_container_port: 8080      # PromLens internal listen port

# --- Prometheus connection (CLI flag --web.default-prometheus-url; NOT env var per RESEARCH §2.3) ---
promlens_prometheus_url: "http://prometheus:9090"
